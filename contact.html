
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا | زاد المسلم</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>زاد المسلم</h1>
        <p>نسعد بتواصلكم معنا</p>

        <nav>
            <a href="home.html">الرئيسية</a>
            <a href="about.html">من نحن</a>
            <a href="azkar.html">الأذكار</a>
            <a href="contact.html">تواصل معنا</a>
            <a href="index.html">تسجيل الخروج</a>
        </nav>

    </header>

    <main>

        <section>

            <h2>تواصل معنا</h2>

            <p>
                نرحب بآرائكم ومقترحاتكم،
                ويسعدنا استقبال رسائلكم.
            </p>

            <form>

                <label for="name">الاسم الكامل:</label>
                <input type="text" id="name" name="name"
                placeholder="أدخل اسمك الكامل" required>

                <br><br>

                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" name="email"
                placeholder="أدخل بريدك الإلكتروني" required>

                <br><br>

                <label for="subject">الموضوع:</label>
                <input type="text" id="subject" name="subject"
                placeholder="موضوع الرسالة">

                <br><br>

                <label for="message">الرسالة:</label>
                <textarea id="message" name="message"
                rows="6" placeholder="اكتب رسالتك هنا"
                required></textarea>

                <br><br>

                <button type="submit">إرسال الرسالة</button>

            </form>

        </section>

    </main>

    <footer>
        <p>جميع الحقوق محفوظة © زاد المسلم 2026</p>
    </footer>

</body>
</html>
