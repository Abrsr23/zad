
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | زاد المسلم</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>زاد المسلم</h1>
        <p>انضم إلينا وابدأ رحلتك مع ذكر الله</p>
    </header>

    <main>

        <section>
            <h2>إنشاء حساب جديد</h2>

            <form>

                <label for="name">الاسم الكامل:</label>
                <input type="text" id="name" name="name"
                placeholder="أدخل اسمك الكامل" required>

                <br><br>

                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" name="email"
                placeholder="أدخل بريدك الإلكتروني" required>

                <br><br>

                <label for="phone">رقم الهاتف:</label>
                <input type="tel" id="phone" name="phone"
                placeholder="أدخل رقم الهاتف">

                <br><br>

                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password"
                placeholder="أنشئ كلمة مرور" required>

                <br><br>

                <label for="confirm">تأكيد كلمة المرور:</label>
                <input type="password" id="confirm" name="confirm"
                placeholder="أعد كتابة كلمة المرور" required>

                <br><br>

                <button type="submit">إنشاء الحساب</button>

            </form>

            <p>لديك حساب بالفعل؟</p>
            <a href="index.html">تسجيل الدخول</a>

        </section>

    </main>

    <footer>
        <p>جميع الحقوق محفوظة © زاد المسلم 2026</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
